<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academia Power - Cadastro de Aluno</title>

    <!-- CSS -->
    <link rel="stylesheet" href="cadastro.css">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>


    <!-- ========================================
         MENU SUPERIOR
    ========================================= -->

    <header class="navbar">

        <!-- LOGO -->

        <div class="logo">

            <i class="fa-solid fa-dumbbell"></i>

            <span>
                ACADEMIA <strong>POWER</strong>
            </span>

        </div>


        <!-- MENU -->

        <nav>

            <a href="cadastro.html" class="menu-ativo">

                <i class="fa-regular fa-user"></i>

                <span>
                    Alunos
                </span>

            </a>


            <a href="treino.html">

                <i class="fa-solid fa-dumbbell"></i>

                <span>
                    Treinos
                </span>

            </a>


            <a href="planos.html">

                <i class="fa-regular fa-calendar"></i>

                <span>
                    Planos
                </span>

            </a>

        </nav>


        <!-- ADMINISTRADOR -->

        <div class="administrador">

            <i class="fa-regular fa-bell"></i>

            <span>
                Administrador
            </span>

        </div>

    </header>



    <!-- ========================================
         CONTEÚDO
    ========================================= -->

    <main class="container">


        <h1>
            Cadastro <span>de Aluno</span>
        </h1>



        <form id="formCadastro">


            <!-- ========================================
                 DADOS PESSOAIS
            ========================================= -->

            <section class="card">

                <h2 class="titulo-section">

                    👤 Dados Pessoais

                </h2>


                <div class="form-grid">


                    <!-- NOME -->

                    <div class="campo coluna-2">

                        <label for="nome">
                            Nome Completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite o nome completo"
                            required
                        >

                    </div>



                    <!-- DATA NASCIMENTO -->

                    <div class="campo">

                        <label for="nascimento">
                            Data de Nascimento
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                            required
                        >

                    </div>



                    <!-- CPF -->

                    <div class="campo">

                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                        >

                    </div>



                    <!-- TELEFONE -->

                    <div class="campo">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            placeholder="(00) 00000-0000"
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="exemplo@email.com"
                        >

                    </div>


                </div>

            </section>



            <!-- ========================================
                 DADOS DA MATRÍCULA
            ========================================= -->

            <section class="card">


                <h2 class="titulo-section">

                    📅 Dados da Matrícula

                </h2>



                <div class="form-grid">


                    <!-- PLANO -->

                    <div class="campo">

                        <label for="plano">
                            Plano
                        </label>

                        <select id="plano" required>

                            <option value="">
                                Selecione o plano
                            </option>

                            <option>
                                Plano Básico
                            </option>

                            <option>
                                Plano Premium
                            </option>

                            <option>
                                Plano Gold
                            </option>

                            <option>
                                Plano Anual
                            </option>

                        </select>

                    </div>



                    <!-- DATA DE INÍCIO -->

                    <div class="campo">

                        <label for="inicio">
                            Data de Início
                        </label>

                        <input
                            type="date"
                            id="inicio"
                            required
                        >

                    </div>



                    <!-- PROFESSOR -->

                    <div class="campo">

                        <label for="professor">
                            Professor
                        </label>

                        <select id="professor">

                            <option value="">
                                Selecione o professor
                            </option>

                            <option>
                                João Silva
                            </option>

                            <option>
                                Marcos Oliveira
                            </option>

                            <option>
                                Camila Santos
                            </option>

                            <option>
                                Fernanda Souza
                            </option>

                        </select>

                    </div>



                    <!-- PAGAMENTO -->

                    <div class="campo">

                        <label for="pagamento">
                            Forma de Pagamento
                        </label>

                        <select id="pagamento" required>

                            <option value="">
                                Selecione
                            </option>

                            <option>
                                PIX
                            </option>

                            <option>
                                Cartão de Crédito
                            </option>

                            <option>
                                Cartão de Débito
                            </option>

                            <option>
                                Dinheiro
                            </option>

                            <option>
                                Boleto
                            </option>

                        </select>

                    </div>



                    <!-- OBSERVAÇÕES -->

                    <div class="campo coluna-2">

                        <label for="observacoes">
                            Observações (opcional)
                        </label>

                        <textarea
                            id="observacoes"
                            placeholder="Observações adicionais (opcional)"
                        ></textarea>

                    </div>


                </div>

            </section>



            <!-- ========================================
                 BOTÕES
            ========================================= -->

            <div class="botoes">

                <button
                    type="button"
                    id="cancelar"
                >
                    Cancelar
                </button>


                <button
                    type="reset"
                    class="btn-laranja"
                >
                    Limpar
                </button>


                <button
                    type="submit"
                    class="btn-laranja"
                >
                    💾 Salvar Cadastro
                </button>

            </div>


        </form>


    </main>



    <!-- JAVASCRIPT -->

    <script src="cadastro.js"></script>


</body>

</html>
