<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academia Power - Instrutores</title>

    <link rel="stylesheet" href="instrutores.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body>

<header class="navbar">

    <div class="logo">
        <i class="fa-solid fa-dumbbell"></i>

        <span>
            ACADEMIA <strong>POWER</strong>
        </span>
    </div>

    <nav>

        <a href="cadastro.html">
            <i class="fa-regular fa-user"></i>
            <span>Alunos</span>
        </a>

        <a href="instrutores.html" class="menu-ativo">
            <i class="fa-solid fa-person-chalkboard"></i>
            <span>Instrutores</span>
        </a>

        <a href="planos.html">
            <i class="fa-regular fa-calendar"></i>
            <span>Planos</span>
        </a>

        <a href="treino.html">
            <i class="fa-solid fa-dumbbell"></i>
            <span>Treinos</span>
        </a>

        <a href="exercicios.html">
            <i class="fa-solid fa-person-running"></i>
            <span>Exercícios</span>
        </a>

        <a href="renovacoes.html">
            <i class="fa-solid fa-rotate"></i>
            <span>Renovações</span>
        </a>

    </nav>

    <div class="administrador">

        <i class="fa-regular fa-bell"></i>

        <span>
            Administrador
        </span>

    </div>

</header>


<main class="container">

    <div class="topo">

        <div>
            <h1>
                Gestão de <span>Instrutores</span>
            </h1>

            <p>
                Cadastre e gerencie os profissionais da academia.
            </p>
        </div>

        <button class="btn-novo" id="novoInstrutor">

            <i class="fa-solid fa-plus"></i>

            Novo Instrutor

        </button>

    </div>


    <!-- RESUMO -->

    <section class="resumo">

        <div class="resumo-card">

            <div class="resumo-icone">
                <i class="fa-solid fa-users"></i>
            </div>

            <div>
                <span>Total de Instrutores</span>
                <strong id="totalInstrutores">4</strong>
            </div>

        </div>


        <div class="resumo-card">

            <div class="resumo-icone ativo">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <div>
                <span>Instrutores Ativos</span>
                <strong id="instrutoresAtivos">4</strong>
            </div>

        </div>


        <div class="resumo-card">

            <div class="resumo-icone alunos">
                <i class="fa-solid fa-user-group"></i>
            </div>

            <div>
                <span>Alunos Acompanhados</span>
                <strong>86</strong>
            </div>

        </div>

    </section>


    <!-- LISTA -->

    <section class="card">

        <div class="card-topo">

            <h2>
                <i class="fa-solid fa-person-chalkboard"></i>
                Instrutores cadastrados
            </h2>

            <div class="pesquisa">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar instrutor..."
                >

            </div>

        </div>


        <div class="lista-instrutores" id="listaInstrutores"></div>

    </section>

</main>


<!-- MODAL -->

<div class="modal" id="modalInstrutor">

    <div class="modal-conteudo">

        <div class="modal-cabecalho">

            <h2 id="tituloModal">
                Novo Instrutor
            </h2>

            <button
                type="button"
                class="fechar"
                id="fecharModal"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <form id="formInstrutor">

            <div class="form-grid">

                <div class="campo coluna-2">

                    <label for="nome">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome completo"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="especialidade">
                        Especialidade
                    </label>

                    <select id="especialidade" required>

                        <option value="">
                            Selecione
                        </option>

                        <option>
                            Musculação
                        </option>

                        <option>
                            Personal Trainer
                        </option>

                        <option>
                            Funcional
                        </option>

                        <option>
                            Cross Training
                        </option>

                        <option>
                            Avaliação Física
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option>
                            Ativo
                        </option>

                        <option>
                            Inativo
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-botoes">

                <button
                    type="button"
                    id="cancelar"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-laranja"
                >
                    <i class="fa-solid fa-floppy-disk"></i>
                    Salvar Instrutor
                </button>

            </div>

        </form>

    </div>

</div>


<script src="instrutores.js"></script>

</body>
</html>
