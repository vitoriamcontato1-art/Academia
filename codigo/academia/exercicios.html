<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Academia Power - Exercícios</title>

    <link rel="stylesheet" href="exercicios.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">

        <i class="fa-solid fa-dumbbell"></i>

        <span>
            ACADEMIA <strong>POWER</strong>
        </span>

    </div>


    <nav>

        <a href="cadastro.html">
            <i class="fa-regular fa-user"></i>
            <span>Alunos</span>
        </a>

        <a href="instrutores.html">
            <i class="fa-solid fa-person-chalkboard"></i>
            <span>Instrutores</span>
        </a>

        <a href="planos.html">
            <i class="fa-regular fa-calendar"></i>
            <span>Planos</span>
        </a>

        <a href="treino.html">
            <i class="fa-solid fa-dumbbell"></i>
            <span>Treinos</span>
        </a>

        <a href="exercicios.html" class="menu-ativo">
            <i class="fa-solid fa-person-running"></i>
            <span>Exercícios</span>
        </a>

        <a href="renovacoes.html">
            <i class="fa-solid fa-rotate"></i>
            <span>Renovações</span>
        </a>

    </nav>


    <div class="administrador">

        <i class="fa-regular fa-bell"></i>

        <span>
            Administrador
        </span>

    </div>

</header>


<main class="container">


    <div class="topo">

        <div>

            <h1>
                Biblioteca de <span>Exercícios</span>
            </h1>

            <p>
                Gerencie os exercícios disponíveis para os treinos.
            </p>

        </div>


        <button
            class="btn-novo"
            id="novoExercicio"
        >

            <i class="fa-solid fa-plus"></i>

            Novo Exercício

        </button>

    </div>


    <!-- RESUMO -->

    <section class="resumo">

        <div class="resumo-card">

            <div class="icone">
                <i class="fa-solid fa-dumbbell"></i>
            </div>

            <div>
                <span>Total de Exercícios</span>
                <strong id="totalExercicios">10</strong>
            </div>

        </div>


        <div class="resumo-card">

            <div class="icone azul">
                <i class="fa-solid fa-person-running"></i>
            </div>

            <div>
                <span>Grupos Musculares</span>
                <strong>8</strong>
            </div>

        </div>


        <div class="resumo-card">

            <div class="icone verde">
                <i class="fa-solid fa-list-check"></i>
            </div>

            <div>
                <span>Exercícios Ativos</span>
                <strong id="exerciciosAtivos">10</strong>
            </div>

        </div>

    </section>


    <!-- PESQUISA -->

    <section class="filtros">

        <div class="pesquisa">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar exercício..."
            >

        </div>


        <select id="filtroGrupo">

            <option value="">
                Todos os grupos
            </option>

            <option value="Peito">
                Peito
            </option>

            <option value="Costas">
                Costas
            </option>

            <option value="Pernas">
                Pernas
            </option>

            <option value="Bíceps">
                Bíceps
            </option>

            <option value="Tríceps">
                Tríceps
            </option>

            <option value="Ombros">
                Ombros
            </option>

            <option value="Abdômen">
                Abdômen
            </option>

        </select>

    </section>


    <!-- LISTA -->

    <section class="card">

        <div class="cabecalho">

            <span>Exercício</span>

            <span>Grupo Muscular</span>

            <span>Equipamento</span>

            <span>Status</span>

            <span>Ações</span>

        </div>


        <div id="listaExercicios"></div>

    </section>


</main>


<!-- MODAL -->

<div class="modal" id="modalExercicio">

    <div class="modal-conteudo">

        <div class="modal-topo">

            <h2>
                Novo Exercício
            </h2>

            <button
                id="fecharModal"
                class="fechar"
                type="button"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <form id="formExercicio">

            <div class="form-grid">

                <div class="campo coluna-2">

                    <label for="nome">
                        Nome do Exercício
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex: Supino Reto"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="grupo">
                        Grupo Muscular
                    </label>

                    <select id="grupo" required>

                        <option value="">
                            Selecione
                        </option>

                        <option>Peito</option>
                        <option>Costas</option>
                        <option>Pernas</option>
                        <option>Bíceps</option>
                        <option>Tríceps</option>
                        <option>Ombros</option>
                        <option>Abdômen</option>

                    </select>

                </div>


                <div class="campo">

                    <label for="equipamento">
                        Equipamento
                    </label>

                    <input
                        type="text"
                        id="equipamento"
                        placeholder="Ex: Barra"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option>
                            Ativo
                        </option>

                        <option>
                            Inativo
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-botoes">

                <button
                    type="button"
                    id="cancelar"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-laranja"
                >
                    <i class="fa-solid fa-floppy-disk"></i>
                    Salvar Exercício
                </button>

            </div>

        </form>

    </div>

</div>


<script src="exercicios.js"></script>

</body>
</html>
